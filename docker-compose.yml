networks:
  default:
    name: gram_net
    external: true

services:
  app:
    container_name: gram
    labels:
      - "traefik.http.services.gram.loadbalancer.server.port=8000"
      - "traefik.docker.network=gram_net"
    build: .
    ports:
      - "8000:8000"
    volumes:
      - meal-data:/data
    restart: unless-stopped

volumes:
  meal-data:
